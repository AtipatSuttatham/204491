[project]
name = "lms-backend"
version = "0.1.0"
description = "LMS (Learning Management System) — Django + DRF backend"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.4",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "model-bakery>=1.19",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4"]

[tool.ruff.lint.isort]
known-first-party = [
    "config",
    "common",
    "accounts",
    "academics",
    "content",
    "enrollment",
    "assessments",
    "assignments",
    "grading",
    "announcements",
    "notifications",
    "audit",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_test.py"]
addopts = "--reuse-db"

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*", "manage.py", "config/*"]
